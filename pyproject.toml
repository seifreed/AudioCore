[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audiocore"
version = "1.0.0"
description = "Python audio/video transcription engine with dual backend support"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "Marc Rivero", email = "mriverolopez@gmail.com" },
]
maintainers = [
    { name = "Marc Rivero", email = "mriverolopez@gmail.com" },
]
keywords = ["transcription", "audio", "video", "whisper", "speech-to-text", "openai", "faster-whisper"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
urls = { Homepage = "https://github.com/seifreed/AudioCore", Repository = "https://github.com/seifreed/AudioCore", Documentation = "https://github.com/seifreed/AudioCore#readme", Issues = "https://github.com/seifreed/AudioCore/issues" }

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "silero-vad>=5.1.2",  # offline bundled VAD model; replaces torch.hub remote-code load (CWE-494)
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "faster-whisper>=1.0.0",
    "huggingface-hub>=0.20.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    # Transitive-dependency security floors (pinned at the boundary). Each is
    # the first release that fixes a known advisory in a package pulled in by
    # the dependencies above; bump as new advisories land.
    "idna>=3.15",        # via httpx/anyio — CVE-2026-45409
    "urllib3>=2.7.0",    # via requests — PYSEC-2026-141, PYSEC-2026-142
    "requests>=2.33.0",  # via huggingface-hub — CVE-2026-25645
    "pygments>=2.20.0",  # via rich — CVE-2026-4539
]

[project.optional-dependencies]
# Live microphone capture for real-time transcription. Optional: any iterable
# of float32 chunks works as an AudioSource without this dependency.
realtime = [
    "sounddevice>=0.4.6",
]
# Speaker diarization via pyannote.audio (gated HF model; needs a token).
# Optional: any Diarizer-protocol object works without this dependency.
diarization = [
    "pyannote.audio>=3.1",
]
dev = [
    "pytest>=9.0.3",  # CVE-2025-71176 fixed in 9.0.3
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "bandit>=1.7.0",
    "black>=24.0.0",
]

[project.scripts]
audiocore = "audiocore.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/audiocore"]

[tool.hatch.build.targets.sdist]
include = ["src/audiocore", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: marks tests that exercise integration paths",
]

[tool.coverage.run]
source = ["src/audiocore"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
target-version = ["py313", "py314"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "TCH"]
ignore = ["E501", "SIM115", "TC001", "TC002", "TC003", "TC004"]

[tool.mypy]
python_version = "3.13"
strict = false
warn_return_any = false
# Surface redundant inline ignores so suppressions can't silently pile up.
warn_unused_ignores = true
show_error_codes = true
# Third-party packages without type stubs (torch, faster_whisper, openai
# response objects, etc.) are treated as untyped rather than erroring.
ignore_missing_imports = true
exclude = [
    "tests/",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101", "B404", "B603"]
