[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audiocore"
version = "1.0.0"
description = "Python audio/video transcription engine with dual backend support"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Marc Rivero", email = "mriverolopez@gmail.com" },
]
maintainers = [
    { name = "Marc Rivero", email = "mriverolopez@gmail.com" },
]
keywords = ["transcription", "audio", "video", "whisper", "speech-to-text", "openai", "faster-whisper"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
urls = { Homepage = "https://github.com/seifreed/AudioCore", Repository = "https://github.com/seifreed/AudioCore", Documentation = "https://github.com/seifreed/AudioCore#readme", Issues = "https://github.com/seifreed/AudioCore/issues" }

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "faster-whisper>=1.0.0",
    "huggingface-hub>=0.20.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "bandit>=1.7.0",
    "black>=24.0.0",
]

[project.scripts]
audiocore = "audiocore.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/audiocore"]

[tool.hatch.build.targets.sdist]
include = ["src/audiocore", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/audiocore"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "TCH"]
ignore = ["E501", "SIM115", "TC001", "TC002", "TC003", "TC004"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = false
warn_unused_ignores = false
show_error_codes = true
ignore_missing_imports = true
disable_error_code = ["assignment", "arg-type", "operator", "no-untyped-def", "call-overload", "attr-defined", "no-any-return", "misc", "call-arg"]
exclude = [
    "tests/",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]